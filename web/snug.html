<title>Snug</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@800;900&display=swap">
<style>
/* Art direction: bright cartoon "sticker" world. One ink outline colour on everything, chunky 3D buttons,
   paper panels with ribbon headers. Deliberately a single light world (it's a game scene, not a document). */
:root{
  --ink:#2b2040; --paper:#fffaf0; --paper2:#f2e8d6; --muted:#7a6d8e;
  --green:#5fd34a; --greenD:#2f9a2c; --yellow:#ffcf3a; --yellowD:#d18f00;
  --pink:#ff6f91; --pinkD:#c93d62; --blue:#3fb4f0; --blueD:#1f7fc0; --purple:#8a6bff; --purpleD:#5b3fd0;
  --sky:#56c3f0;
  --display:"Lilita One","Arial Rounded MT Bold","Arial Black",system-ui,sans-serif;
  --body:"Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --o2:2px 0 0 var(--ink),-2px 0 0 var(--ink),0 2px 0 var(--ink),0 -2px 0 var(--ink),1.5px 1.5px 0 var(--ink),-1.5px 1.5px 0 var(--ink),1.5px -1.5px 0 var(--ink),-1.5px -1.5px 0 var(--ink);
  --o3:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),2.2px 2.2px 0 var(--ink),-2.2px 2.2px 0 var(--ink),2.2px -2.2px 0 var(--ink),-2.2px -2.2px 0 var(--ink);
  color-scheme:light;
}
html{box-sizing:border-box;height:100%}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--sky);color:var(--ink);font-family:var(--body);font-weight:800;
  overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#stage{position:relative;height:100%;max-width:520px;margin:0 auto;overflow:hidden;touch-action:none;background:var(--sky)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
svg.ic{width:1em;height:1em;flex:none;display:block}
.outline{color:#fff;text-shadow:var(--o3),0 6px 0 var(--ink)}
.outline-s{color:#fff;text-shadow:var(--o2),0 3px 0 var(--ink)}

.layer{position:absolute;inset:0;display:flex;flex-direction:column;align-items:stretch;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:12px 16px;pointer-events:none}
.layer > *{pointer-events:auto}
.layer .passthru,.passthru{pointer-events:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible{outline:4px solid #fff;outline-offset:3px}

/* ---- buttons ---- */
.btn{--c:var(--green);--cd:var(--greenD);display:inline-flex;align-items:center;justify-content:center;gap:10px;
  font-family:var(--display);font-size:24px;letter-spacing:.02em;color:#fff;text-shadow:var(--o2),0 2px 0 var(--ink);
  background:var(--c);border:3px solid var(--ink);border-radius:20px;padding:12px 22px 15px;
  box-shadow:inset 0 -7px 0 var(--cd),inset 0 4px 0 rgba(255,255,255,.45),0 5px 0 var(--ink);transition:transform .06s}
.btn:active{transform:translateY(4px);box-shadow:inset 0 -4px 0 var(--cd),inset 0 3px 0 rgba(255,255,255,.4),0 1px 0 var(--ink)}
.btn .ic{font-size:26px;filter:drop-shadow(0 2px 0 var(--ink))}
.btn.yellow{--c:var(--yellow);--cd:var(--yellowD)} .btn.pink{--c:var(--pink);--cd:var(--pinkD)}
.btn.blue{--c:var(--blue);--cd:var(--blueD)} .btn.purple{--c:var(--purple);--cd:var(--purpleD)}
.btn.big{font-size:32px;padding:14px 26px 18px;border-radius:24px}
.btn.wide{width:100%}
.btn .tag{font-family:var(--body);font-size:12px;font-weight:900;letter-spacing:.06em;text-shadow:none;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:8px;padding:1px 6px}
.rbtn{--c:var(--blue);--cd:var(--blueD);position:relative;display:grid;place-items:center;width:62px;height:62px;border-radius:50%;
  background:var(--c);border:3px solid var(--ink);box-shadow:inset 0 -6px 0 var(--cd),inset 0 4px 0 rgba(255,255,255,.45),0 4px 0 var(--ink);color:#fff;flex:none;transition:transform .06s}
.rbtn .ic{font-size:30px;filter:drop-shadow(0 2px 0 var(--ink))}
.rbtn.small{width:46px;height:46px}.rbtn.small .ic{font-size:24px}
.rbtn.pink{--c:var(--pink);--cd:var(--pinkD)}.rbtn.green{--c:var(--green);--cd:var(--greenD)}.rbtn.yellow{--c:var(--yellow);--cd:var(--yellowD)}
button:active .rbtn,.rbtn:active{transform:translateY(3px);box-shadow:inset 0 -3px 0 var(--cd),0 1px 0 var(--ink)}
.badge{position:absolute;top:-6px;right:-6px;min-width:24px;height:24px;border-radius:12px;background:var(--pink);border:3px solid var(--ink);
  font-family:var(--display);font-size:14px;line-height:18px;color:#fff;text-align:center;padding:0 4px}

/* ---- top bar ---- */
.topbar{display:flex;align-items:center;gap:10px}
.lvl{display:flex;align-items:center;flex:1;min-width:0}
.lvlstar{position:relative;width:52px;height:52px;flex:none;z-index:1;filter:drop-shadow(0 3px 0 var(--ink))}
.lvlstar svg{width:100%;height:100%}
.lvlstar b{position:absolute;inset:0;display:grid;place-items:center;padding-top:5px;font-family:var(--display);font-weight:400;font-size:19px;color:#fff;text-shadow:var(--o2)}
.xpbar{flex:1;max-width:150px;height:20px;margin-left:-12px;border:3px solid var(--ink);border-radius:0 12px 12px 0;background:var(--paper2);overflow:hidden;box-shadow:0 3px 0 var(--ink)}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(var(--green) 55%,var(--greenD) 55%);transition:width .6s}
.pill{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px 0 6px;border:3px solid var(--ink);border-radius:20px;background:var(--paper);
  box-shadow:0 3px 0 var(--ink);font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.pill .ic{font-size:28px}

/* ---- home ---- */
.logo{text-align:center;margin-top:clamp(14px,5vh,48px)}
.logo h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(84px,27vw,124px);line-height:.9;letter-spacing:.01em;display:inline-flex}
.logo h1 span{display:inline-block;text-shadow:var(--o3),4px 4px 0 var(--ink),0 9px 0 var(--ink);animation:bob 2.4s ease-in-out infinite}
.logo h1 span:nth-child(1){color:var(--pink);transform:rotate(-8deg)}
.logo h1 span:nth-child(2){color:var(--yellow);animation-delay:.15s}
.logo h1 span:nth-child(3){color:var(--green);animation-delay:.3s}
.logo h1 span:nth-child(4){color:var(--blue);animation-delay:.45s;transform:rotate(7deg)}
@keyframes bob{50%{translate:0 -7px}}
.tagline{display:inline-block;margin-top:6px;font-family:var(--display);font-size:20px;color:#fff;background:var(--purple);border:3px solid var(--ink);border-radius:12px;
  padding:3px 14px 5px;box-shadow:0 3px 0 var(--ink);text-shadow:var(--o2);transform:rotate(-3deg)}
.bestpill{margin:14px auto 0;width:max-content;display:flex;align-items:center;gap:8px;padding:5px 16px 5px 8px;background:rgba(43,32,64,.55);border-radius:14px;
  font-family:var(--display);font-size:20px;color:#fff;letter-spacing:.03em}
.bestpill .ic{font-size:26px}
.spacer{flex:1}
.holdhint{align-self:center;margin-bottom:16px;font-family:var(--display);font-size:26px;letter-spacing:.04em;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.92);opacity:.75}}
.dock{display:flex;justify-content:center;gap:clamp(18px,8vw,40px)}
.dockbtn{display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--display);font-size:16px;color:#fff;text-shadow:var(--o2),0 2px 0 var(--ink)}

/* ---- hud ---- */
.hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:start}
.score{font-family:var(--display);font-size:68px;line-height:1;text-align:center;font-variant-numeric:tabular-nums;padding-top:4px}
.score.pop{animation:spop .18s ease-out}
@keyframes spop{from{transform:scale(1.25)}}
.lives{display:flex;gap:4px;padding-top:12px}
.pip{width:28px;height:28px;transition:transform .2s,opacity .2s;filter:drop-shadow(0 2px 0 var(--ink))}
.pip.off{opacity:.35;transform:scale(.8);filter:grayscale(1)}
.mult{justify-self:end;margin-top:12px;font-family:var(--display);font-size:24px;color:#fff;background:var(--pink);border:3px solid var(--ink);border-radius:14px;
  padding:2px 10px 4px;box-shadow:0 3px 0 var(--ink);text-shadow:var(--o2);transform:rotate(6deg);transition:transform .15s}
.mult:empty{display:none}

/* ---- panels ---- */
.panel{position:relative;background:var(--paper);border:4px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);
  padding:42px 18px 18px;display:grid;gap:12px;text-align:center}
.ribbon{position:absolute;top:-24px;left:50%;transform:translateX(-50%);white-space:nowrap;font-family:var(--display);font-size:28px;letter-spacing:.03em;
  color:#fff;text-shadow:var(--o2),0 3px 0 var(--ink);background:var(--rc,var(--pink));border:4px solid var(--ink);border-radius:16px;padding:4px 22px 7px;
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.18),0 4px 0 var(--ink)}
.xbtn{position:absolute;top:-16px;right:-12px}
.lbl{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:900}
.modal{position:absolute;inset:0;display:grid;place-items:center;background:rgba(43,32,64,.55);pointer-events:auto;
  padding:40px max(18px,env(safe-area-inset-right,0px)) 24px max(18px,env(safe-area-inset-left,0px));animation:fade .18s}
@keyframes fade{from{opacity:0}}
.modal > .panel{width:100%;max-width:400px;max-height:100%;overflow:visible;animation:popin .32s cubic-bezier(.3,1.5,.5,1)}
@keyframes popin{from{transform:scale(.6);opacity:0}}
.scroll{overflow:auto;max-height:min(62vh,520px);margin:0 -6px;padding:4px 6px 8px}

/* results */
#over{justify-content:center;gap:28px}
.result{margin-top:10px}
.result .big{font-family:var(--display);font-size:96px;line-height:.9;font-variant-numeric:tabular-nums}
.bestline{display:flex;justify-content:center;align-items:center;gap:6px;font-family:var(--display);font-size:20px;color:var(--muted)}
.bestline .ic{font-size:24px}
.newbest{justify-self:center;font-family:var(--display);font-size:20px;color:var(--ink);background:var(--yellow);border:3px solid var(--ink);border-radius:12px;padding:2px 14px 4px;
  box-shadow:0 3px 0 var(--ink);animation:popin .5s cubic-bezier(.3,1.6,.5,1)}
.msg{font-weight:900;font-size:16px;color:var(--ink);min-height:1.3em;text-wrap:balance}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--paper2);border:3px solid var(--ink);border-radius:16px;padding:8px 4px 6px;display:grid;justify-items:center;gap:1px}
.stat .ic{font-size:24px}
.stat b{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:900}
.actions{display:grid;gap:14px}
.actions .row{display:flex;gap:12px;align-items:center}
.actions .row .btn{flex:1}
.tiny{text-align:center;font-family:var(--display);font-size:16px;color:#fff;text-shadow:var(--o2);opacity:.9}

/* missions */
.mis{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;text-align:left;background:var(--paper2);border:3px solid var(--ink);border-radius:18px;padding:10px 12px}
.mis .mi{width:44px;height:44px;grid-row:span 2;border-radius:50%;background:var(--blue);border:3px solid var(--ink);display:grid;place-items:center;color:#fff}
.mis .mi .ic{font-size:24px}
.mis .t{font-weight:900;font-size:15px;line-height:1.2}
.mis .rw{grid-row:span 2;display:flex;align-items:center;gap:4px;font-family:var(--display);font-size:18px}
.mis .rw .ic{font-size:24px}
.pb{position:relative;height:22px;border:3px solid var(--ink);border-radius:10px;background:#fff;overflow:hidden}
.pb i{position:absolute;inset:0 auto 0 0;background:linear-gradient(var(--yellow) 55%,var(--yellowD) 55%)}
.pb span{position:relative;display:block;text-align:center;font-family:var(--display);font-size:14px;line-height:16px;color:#fff;text-shadow:var(--o2)}
.mis.done{background:#e6f8dc}.mis.done .mi{background:var(--green)}.mis.done .pb i{background:linear-gradient(var(--green) 55%,var(--greenD) 55%)}
.done-check{font-size:30px;color:var(--green)}
.timer{font-weight:900;font-size:13px;color:var(--muted)}

/* skins & worlds */
.sect{display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-size:18px;margin-top:6px;text-align:left}
.sect .pill{height:34px;font-size:17px}.sect .pill .ic{font-size:22px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{display:grid;justify-items:center;gap:4px;padding:8px 4px 8px;background:var(--paper2);border:3px solid var(--ink);border-radius:18px;font-family:var(--display);font-size:15px}
.tile canvas{position:static;width:64px;height:64px}
.tile.sel{background:#fff2b8;box-shadow:inset 0 0 0 3px var(--yellow)}
.tile .price{display:inline-flex;align-items:center;gap:3px;font-size:14px;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:1px 8px 2px}
.tile .price .ic{font-size:16px}
.tile.locked canvas{opacity:.9}
.tile .state{font-size:13px;color:var(--muted)}
.tile.sel .state{color:var(--yellowD)}

/* settings */
.setrow{display:flex;align-items:center;gap:12px;background:var(--paper2);border:3px solid var(--ink);border-radius:18px;padding:10px 12px;text-align:left;font-family:var(--display);font-size:20px}
.setrow .ic{font-size:28px}
.setrow span{flex:1}
.sw{width:64px;height:36px;border-radius:18px;background:#cfc4dc;border:3px solid var(--ink);position:relative;box-shadow:inset 0 3px 0 rgba(0,0,0,.12)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--ink);transition:left .18s}
.sw[aria-pressed="true"]{background:var(--green)}.sw[aria-pressed="true"]::after{left:28px}
.note{font-size:13px;color:var(--muted);line-height:1.45;margin:0;font-weight:800;text-align:left}

/* daily */
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.day{position:relative;display:grid;justify-items:center;gap:2px;padding:6px 2px 8px;border:3px solid var(--ink);border-radius:14px;background:var(--paper2);font-family:var(--display);font-size:14px}
.day .ic{font-size:28px}
.day.big{grid-column:span 2;background:#efe4ff}
.day.got{background:#e6f8dc}.day.got .ic{opacity:.45}
.day.now{background:var(--yellow);transform:scale(1.06);box-shadow:0 4px 0 var(--ink)}
.day .tick{position:absolute;right:-6px;top:-8px;width:24px;height:24px;border-radius:50%;background:var(--green);border:3px solid var(--ink);display:grid;place-items:center;color:#fff}
.day .tick .ic{font-size:14px;opacity:1}

/* revive */
.ring{position:relative;width:132px;height:132px;justify-self:center}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:400;font-size:58px}
.textbtn{font-family:var(--display);font-size:18px;color:var(--muted);padding:6px}

/* toasts & ads */
.toasts{position:absolute;left:0;right:0;bottom:calc(130px + env(safe-area-inset-bottom,0px));display:grid;justify-items:center;gap:8px;pointer-events:none;padding-inline:16px;z-index:5}
.toast{display:flex;gap:6px;align-items:center;font-family:var(--display);font-size:18px;background:var(--paper);border:3px solid var(--ink);border-radius:16px;
  padding:5px 14px 6px 8px;box-shadow:0 4px 0 var(--ink);animation:toast 2.6s ease forwards}
.toast .ic{font-size:24px}
@keyframes toast{0%{transform:translateY(-16px) scale(.8);opacity:0}10%,80%{transform:none;opacity:1}100%{opacity:0;transform:translateY(-8px)}}
.adfake{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:14px;background:#14102a;pointer-events:auto;text-align:center;padding:24px;z-index:10}
.adfake .k{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#a99cc8;font-weight:900}
.adfake .t{font-family:var(--display);font-size:34px;color:#fff}
.adfake .cd{font-family:var(--display);font-size:22px;color:#a99cc8}
/* variety: intro banner, power-up chips, zone progress */
.intro{position:absolute;left:50%;top:22%;transform:translateX(-50%);width:min(330px,88%);display:grid;justify-items:center;gap:4px;text-align:center;
  background:var(--paper);border:4px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:22px 14px 12px;animation:popin .35s cubic-bezier(.3,1.5,.5,1)}
.intro .newtag{position:absolute;top:-18px;font-family:var(--display);font-size:18px;color:#fff;background:var(--pink);border:3px solid var(--ink);border-radius:10px;padding:1px 12px 3px;text-shadow:var(--o2);transform:rotate(-4deg)}
.intro b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.05}
.intro span{font-weight:900;font-size:15px}
.pwchips{display:grid;justify-items:end;gap:6px;margin-top:10px}
.pwchip{display:flex;align-items:center;gap:4px;font-family:var(--display);font-size:16px;background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:1px 8px 2px 4px;box-shadow:0 3px 0 var(--ink)}
.pwchip .ic{font-size:22px}
.zonebar{display:grid;gap:4px;text-align:left;font-weight:900;font-size:14px}
.zonebar b{font-family:var(--display);font-weight:400;font-size:16px}
.tile .state .ic{display:inline;vertical-align:-2px}
@media (prefers-reduced-motion:reduce){.holdhint,.logo h1 span{animation:none}*{animation-duration:.01s!important}}
</style>

    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z" fill="#fff" stroke="#2b2040" stroke-width="2.2" stroke-linejoin="round"/></symbol>

<script>
(() => {
"use strict";
// ---------- tiny utils ----------
const $ = id => document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, rand=(a,b)=>a+Math.random()*(b-a);
const todayKey=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const dayDiff=(a,b)=>Math.round((new Date(b+"T12:00")-new Date(a+"T12:00"))/864e5);
function seeded(seed){let s=0;for(const c of seed)s=(s*31+c.charCodeAt(0))>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const ic=(id,cls="ic")=>`<svg class="${cls}"><use href="#i-${id}"/></svg>`;
const INK="#2b2040";

// ---------- content tables (ids kept stable for saved progress) ----------
const SKINS=[
 {id:"peach",name:"Peach",c:"#ffa979",d:"#e2734a",cost:0},
 {id:"mint",name:"Mint",c:"#6fe3b4",d:"#2fae84",cost:150},
 {id:"lilac",name:"Grape",c:"#b48cff",d:"#7c55d6",cost:300},
 {id:"lemon",name:"Lemon",c:"#ffe04d",d:"#d9aa12",cost:450},
 {id:"sky",name:"Berry",c:"#5cc6ff",d:"#2386cc",cost:600},
 {id:"ruby",name:"Cherry",c:"#ff5d7d",d:"#c92e52",cost:800},
 {id:"aurora",name:"Rainbow",c:"#9ff5e6",d:"#8a6cff",cost:-1,note:"Day 7 gift"}
];
const THEMES=[
 {id:"pond",name:"Meadow",lvl:1,top:"#4fbdf0",bot:"#c9f1ff",far:"#9be0a0",near:"#62c46e",gate:"#ff8fb1",gateD:"#d65b86",cloud:"#ffffff",sun:"#ffe26b"},
 {id:"dusk",name:"Sunset",lvl:3,top:"#ff8f7a",bot:"#ffe1a3",far:"#f0a0b4",near:"#d06a8c",gate:"#6fd0f7",gateD:"#2f93c4",cloud:"#fff1e6",sun:"#fff2b0"},
 {id:"moss",name:"Candy",lvl:5,top:"#b597ff",bot:"#ffd3ee",far:"#ffa6d6",near:"#ff79b8",gate:"#fff07a",gateD:"#d6b92a",cloud:"#ffffff",sun:"#ffffff"},
 {id:"ember",name:"Starry",lvl:8,top:"#1c1d4f",bot:"#4d3a90",far:"#33357a",near:"#25275f",gate:"#6ee7c8",gateD:"#2fae90",cloud:"#5d55a8",sun:"#fff6c8",night:true}
];
const MISSION_POOL=[
 {k:"perfRun",t:6,rw:25,i:"star",txt:n=>`Get ${n} Perfects in one run`},
 {k:"chain",t:4,rw:30,i:"star",txt:n=>`Chain ${n} Perfects in a row`},
 {k:"gatesRun",t:25,rw:30,i:"gates",txt:n=>`Pass ${n} gates in one run`},
 {k:"scoreRun",t:40,rw:35,i:"trophy",txt:n=>`Score ${n} in one run`},
 {k:"runs",t:5,rw:20,i:"play",txt:n=>`Play ${n} runs`},
 {k:"coins",t:15,rw:25,i:"coin",txt:n=>`Collect ${n} coins`},
 {k:"squeeze",t:2,rw:30,i:"blob",txt:n=>`Pull off ${n} Squeezes`},
 {k:"gold",t:1,rw:30,i:"coin",txt:()=>`Nail a gold gate`},
 {k:"smash",t:3,rw:30,i:"gates",txt:n=>`Smash ${n} glass gates`},
 {k:"gems",t:8,rw:25,i:"gem",txt:n=>`Grab ${n} gems`},
 {k:"box",t:2,rw:30,i:"gift",txt:n=>`Open ${n} mystery boxes`}
];
// Zones: the sky changes as you climb. Reaching one saves it to your collection.
const ZONE_AT=[0,25,50,80];
const zoneOf=p=>ZONE_AT.filter(z=>p>=z).length-1;
const INTROS={gem:["GEMS!","Grow big between gates to grab them"],glass:["GLASS GATE!","Be BIGGER than the gap to smash it"],
  box:["MYSTERY BOX!","Fit it PERFECTLY to open the box"],twin:["TWIN GATES!","Two gates close together. Resize fast!"]};
const POWERS={shield:["SHIELD!","shield"],slow:["SLOW-MO!","slow"],double:["DOUBLE POINTS!","x2"]};
const STREAK_REWARDS=[10,15,20,25,30,40,50];
const xpNeed=l=>80+l*40;

// ---------- save ----------
const DEF={best:0,coins:0,xp:0,level:1,skins:["peach"],skin:"peach",theme:"pond",streak:0,lastDay:null,
  mDay:null,missions:[],runs:0,sessions:0,sound:true,haptics:true,seen:{},zone:0};
let S=Object.assign({},DEF);
try{const raw=localStorage.getItem("snug.v1");if(raw)S=Object.assign({},DEF,JSON.parse(raw))}catch(e){}
if(!S.seen)S.seen={};
const save=()=>{try{localStorage.setItem("snug.v1",JSON.stringify(S))}catch(e){}};
S.sessions++;

// ---------- audio & haptics ----------
let AC=null, hum=null, humGain=null;
function audio(){ if(!S.sound) return null; if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();
  hum=AC.createOscillator();humGain=AC.createGain();hum.type="sine";humGain.gain.value=0;hum.connect(humGain).connect(AC.destination);hum.start()}catch(e){AC=null}}
  if(AC&&AC.state==="suspended")AC.resume(); return AC;}
function tone(f,dur=.12,type="sine",vol=.18,slide=0,delay=0){const a=audio();if(!a)return;const t=a.currentTime+delay;
  const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f*slide),t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.02)}
const PENTA=[0,2,4,7,9,12,14,16,19,21,24];
const note=i=>523.25*Math.pow(2,PENTA[Math.min(i,PENTA.length-1)]/12);
const SFX={
 perfect:s=>{tone(note(s),.22,"triangle",.2);tone(note(s)*2,.16,"sine",.07,0,.03)},
 good:()=>tone(392,.12,"triangle",.13),
 loose:()=>tone(160,.22,"sine",.2,.6),
 squeeze:()=>{tone(700,.08,"square",.06,1.6);tone(note(6),.25,"triangle",.18,0,.06)},
 crash:()=>{tone(220,.35,"sawtooth",.12,.3);tone(90,.4,"sine",.25,.5)},
 coin:()=>{tone(1318,.07,"square",.05);tone(1760,.12,"square",.05,0,.06)},
 ui:()=>tone(660,.06,"triangle",.08),
 reward:()=>[0,3,5,7].forEach((n,i)=>tone(note(n),.18,"triangle",.14,0,i*.07))
};
function buzz(ms){if(S.haptics&&navigator.vibrate){try{navigator.vibrate(ms)}catch(e){}}}

// ---------- canvas ----------
const cv=$("cv"), ctx=cv.getContext("2d");
const LW=360; let LH=640, SC=1, DPR=1, BY=470;
function resize(){const r=cv.getBoundingClientRect();DPR=Math.min(window.devicePixelRatio||1,2.5);SC=r.width/LW;LH=r.height/SC;
  cv.width=Math.round(r.width*DPR);cv.height=Math.round(r.height*DPR);BY=LH*0.72;}
window.addEventListener("resize",resize);

// ---------- game constants ----------
const GROW=140, SHRINK=160, MINF=.3, RAMP=.3, RMIN=12, RMAX=98, BAR_H=24, HOME_R=34; // speed ramps up after each press/release: taps nudge, holds sweep
let lastHold=false, sinceToggle=0;
const rateNow=h=>(h?GROW:SHRINK)*(MINF+(1-MINF)*Math.min(1,sinceToggle/RAMP));
const theme=()=>THEMES[R?R.zone:0]; // the sky follows the zone you've climbed to
const skin=()=>SKINS.find(s=>s.id===S.skin)||SKINS[0];

// ---------- state ----------
let state="home", T=0, holding=false, paused=false;
let R; // run
let blobR=HOME_R, blobVis=1, squish=0, wob=0, shake=0, freezeUntil=0, flash=0, climb=0;
let parts=[], pops=[], zoneT=-9, pwKey="";
const clouds=[]; for(let i=0;i<7;i++)clouds.push({x:rand(-40,LW+40),y:rand(-40,700),s:rand(.6,1.25),z:rand(.3,1)});
const stars=[]; for(let i=0;i<40;i++)stars.push({x:Math.random()*LW,y:Math.random()*900,p:Math.random()*6,s:rand(.6,1.8)});
const sessionStart=performance.now(); let runsSinceInter=0, lastRewardedAt=-1e9;

function newRun(){
  R={n:0,score:0,glow:3,chain:0,bestChain:0,gates:[],gems:[],passed:0,perfects:0,coins:0,squeezes:0,gold:0,smash:0,gemsGot:0,boxes:0,cont:false,doubled:false,first:S.runs===0,t:0,
    zone:0,prevZone:0,nextBox:6,lastType:"",pw:{shield:false,slowUntil:0,dblUntil:0}};
  blobR=Math.min(blobR,30); blobVis=1; parts=[]; pops=[]; sinceToggle=0;
  spawnUntilTop(BY-310);
}
const speed=n=> (R&&R.first&&n<6? 150 : 0) || Math.min(150+4.5*n,360);
const spacing=n=> Math.max(190,300-4*n);
// First five gates teach by play. Gate 1 is wide: players start by holding, so holding all the way = a guaranteed SQUEEZE win.
const SCRIPT=[190,88,136,70,120];

function makeGate(y,sp){
  const n=R.n++, prev=R.gates.length?R.gates[R.gates.length-1].base:60;
  if(sp===undefined)sp=spacing(n);
  let g;
  if(n<SCRIPT.length) g=SCRIPT[n];
  else{
    const k=clamp(n/40,0,1), minG=lerp(70,44,k), maxG=lerp(132,176,k);
    const dt=sp/speed(n);
    const reach=2*Math.min(GROW,SHRINK)*Math.max(0,dt-RAMP*(1-MINF)/2)*0.72; // fairness: change must be physically reachable with slack
    const maxDelta=Math.min(28+n*4,135,reach);
    const minDelta=Math.min(18,maxDelta*0.5);              // avoid boring repeats
    let dir=Math.random()<.5?-1:1;
    if(prev-maxDelta<minG) dir=1; if(prev+maxDelta>maxG) dir=-1;
    g=clamp(prev+dir*rand(minDelta,maxDelta),minG,maxG);
  }
  const type = n>=8 && R.lastType!=="glass" && Math.random()<.16 ? "glass" : "normal";
  const gold = type==="normal" && n>0 && n%10===9;
  const box = type==="normal" && !gold && n>=R.nextBox; if(box) R.nextBox=n+9+Math.floor(Math.random()*5);
  const amp = type==="normal" && n>=30 ? Math.min(6+(n-30)*.6,14) : 0;        // "breathing" gates late game
  const intro = type==="glass"&&!S.seen.glass ? "glass" : box&&!S.seen.box ? "box" : null;
  R.lastType=type;
  R.gates.push({y,base:g,cur:g,amp,ph:Math.random()*6,gold,type,box,intro,done:false,n,res:null,resT:0});
}
function spawnUntilTop(firstY){
  if(!R.gates.length) makeGate(firstY);
  let top=R.gates[R.gates.length-1];
  while(top.y>-80){
    let sp=spacing(R.n), twin=false;
    if(R.n>=15&&!top.twin&&Math.random()<.12){sp=125;twin=true}           // twin pair: second gate arrives fast
    makeGate(top.y-sp,sp);
    const g=R.gates[R.gates.length-1];
    if(twin){g.twin=true;if(!g.intro&&!S.seen.twin)g.intro="twin"}
    // gem floating between gates, off to one side: only a big blob reaches it
    if(R.n>4&&!twin&&Math.random()<.5){const firstGem=!S.seen.gem&&!R.gems.some(x=>x.intro);
      R.gems.push({y:(top.y+g.y)/2,x:LW/2+(Math.random()<.5?-1:1)*rand(42,84),done:false,taken:false,intro:firstGem?"gem":null})}
    top=g;
  }
}

// ---------- judging ----------
const C_WHITE="#ffffff", C_GOLD="#ffcf3a", C_GOOD="#bfe9ff", C_BAD="#ff6f91";
const dblOn=()=>T<R.pw.dblUntil;
function judge(g){
  const gap=g.cur, d=2*blobR, fit=d/gap, early=R.passed<5;
  const tol=early?10:6;
  if(g.intro){S.seen[g.intro]=true;save()}
  if(g.type!=="glass"&&d>gap+tol){
    if(R.pw.shield){ // shield pops instead of the blob

let last=performance.now();

}
function update(dt){

    humSet();

      // first-time mechanic: show a banner and slow down while it approaches
      const iG=R.gates.find(g=>g.intro&&!g.done&&g.y>BY-330), iM=R.gems.find(m=>m.intro&&!m.done&&m.y>BY-330), it=iG||iM;

      R.gems=R.gems.filter(m=>m.y<LH+40&&!m.taken);
      for(const g of R.gates){g.y+=v*dt; g.cur=g.base+g.amp*Math.sin(T*3+g.ph);

  pops=pops.filter(p=>p.life>0);
  const sp=state==="play"?speed(R.passed):18;
  for(const c of clouds){c.y+=sp*.22*c.z*dt;c.x+=6*c.z*dt;if(c.y>LH+80){c.y=-80;c.x=rand(-40,LW+40)}if(c.x>LW+90)c.x=-90}

function starPath(c,r){c.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=i%2?r*.45:r;c.lineTo(Math.cos(a)*rad,Math.sin(a)*rad)}c.closePath()}

}
function drawGate(g,th){

  if(!g.done&&y>-40){ctx.setLineDash([7,7]);ctx.lineWidth=5;ctx.strokeStyle=`rgba(43,32,64,${ghostA*.25})`;ctx.beginPath();ctx.arc(cx,y,half*.93,0,7);ctx.stroke();

function drawBlob(){

// ---------- missions ----------
function ensureMissions(){
  const key=todayKey();
  if(S.mDay===key&&S.missions.length===3)return;
  const rnd=seeded(key), pool=[...MISSION_POOL], out=[];
  while(out.length<3){const i=Math.floor(rnd()*pool.length);const m=pool.splice(i,1)[0];out.push({k:m.k,t:m.t,rw:m.rw,p:0,done:false})}
  S.mDay=key;S.missions=out;save();
}
function trackMissions(r){
  ensureMissions(); const done=[];
  for(const m of S.missions){if(m.done)continue;
    const v={perfRun:r.perfects,chain:r.bestChain,gatesRun:r.passed,scoreRun:r.score}[m.k];
    if(v!==undefined) m.p=Math.max(m.p,v);
    else if(m.k==="runs") m.p++;
    else if(m.k==="coins") m.p+=r.coins;
    else if(m.k==="squeeze") m.p+=r.squeezes;
    else if(m.k==="gold") m.p+=r.gold;
    else if(m.k==="smash") m.p+=r.smash;
    else if(m.k==="gems") m.p+=r.gemsGot;
    else if(m.k==="box") m.p+=r.boxes;
    if(m.p>=m.t){m.p=m.t;m.done=true;S.coins+=m.rw;done.push(m)}}
  return done;
}

      <span class="rw">${m.done?`<svg class="ic done-check"><use href="#i-check"/></svg>`:`${ic("coin")}${m.rw}`}</span>
      <span class="pb"><i style="width:${pct}%"></i><span>${m.p}/${m.t}</span></span></div>`}).join("");
  panel("MISSIONS","var(--green)",`<div class="timer">New missions in ${untilMidnight()}</div><div style="display:grid;gap:10px">${rows}</div>

function checkStreak(){
  const key=todayKey();
  if(S.lastDay===key)return null;
  if(S.lastDay&&dayDiff(S.lastDay,key)===1)S.streak++; else S.streak=1;
  S.lastDay=key;
  const idx=(S.streak-1)%7, coins=STREAK_REWARDS[idx]; S.coins+=coins;
  let gift=null; if(idx===6&&!S.skins.includes("aurora")){S.skins.push("aurora");gift="Rainbow skin"}
  save(); return {coins,gift,idx};
}

   <p class="note">Ads in this prototype are simulated. Video ads only play when you choose them. Runs played: ${S.runs}. Version ${BUILD}.</p>
   <button class="btn pink wide" id="bReset" style="font-size:18px">RESET PROGRESS</button>`);
  m.querySelector("#swS").onclick=e=>{S.sound=!S.sound;e.currentTarget.setAttribute("aria-pressed",S.sound);if(!S.sound&&humGain)humGain.gain.value=0;else SFX.ui();save()};
  m.querySelector("#swH").onclick=e=>{S.haptics=!S.haptics;e.currentTarget.setAttribute("aria-pressed",S.haptics);buzz(15);save()};
  const rb=m.querySelector("#bReset");let armed=false;
  rb.onclick=()=>{if(!armed){armed=true;rb.textContent="TAP AGAIN TO ERASE";return}
    S=Object.assign({},DEF,{sessions:1});save();m.remove();const info=checkStreak();renderHome();if(info)streakModal(info)};
}

// ---------- input ----------
const stage=$("stage");
function isUI(t){return t.closest&&t.closest("button,.panel,.modal,.adfake")}
stage.addEventListener("pointerdown",e=>{
  if(isUI(e.target))return;
  e.preventDefault(); audio();
  if(paused){paused=false;last=performance.now()}
  if(state==="home"){startRun();holding=true;return}
  if(state==="over"){if(performance.now()<overLock)return;startRun();holding=true;return}
  if(state==="play")holding=true;
});
const release=()=>{holding=false};
window.addEventListener("pointerup",release);window.addEventListener("pointercancel",release);
window.addEventListener("keydown",e=>{if(e.code==="Space"&&!e.repeat){e.preventDefault();audio();if(state==="home"||(state==="over"&&performance.now()>overLock)){startRun()}if(paused)paused=false;holding=true}});
window.addEventListener("keyup",e=>{if(e.code==="Space")holding=false});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&state==="play"){paused=true;holding=false}});
stage.addEventListener("contextmenu",e=>e.preventDefault());

$("bSkins").onclick=()=>{SFX.ui();skinsPanel()};
$("bMis").onclick=()=>{SFX.ui();missionsPanel()};
$("bDaily").onclick=()=>{SFX.ui();dailyPanel()};
$("bSet").onclick=()=>{SFX.ui();settingsPanel()};
$("bRetry").onclick=()=>{if(state==="over")startRun()};
$("bHome").onclick=()=>{SFX.ui();goHome()};
$("bDouble").onclick=()=>showAd("rewarded",()=>{S.coins+=R.coins;R.doubled=true;save();$("oCoins").textContent=R.coins*2;$("bDouble").hidden=true;SFX.reward();toast(`+${R.coins} bonus coins`)});

// ---------- stay fresh: phones' home-screen bookmarks cache the page, so check for a newer build ----------
const BUILD="4";
function checkForUpdate(){
  if(!/github\.io$/.test(location.hostname))return;
  fetch(location.pathname+"?b="+Date.now(),{cache:"no-store"}).then(r=>r.text()).then(t=>{
    const m=t.match(/const BUILD="(\w+)"/);if(!m||m[1]===BUILD)return;
    let tried=null;try{tried=sessionStorage.getItem("snug.reload")}catch(e){}
    if(tried===m[1])return; try{sessionStorage.setItem("snug.reload",m[1])}catch(e){}
    if(state==="home")location.replace(location.pathname+"?v="+m[1]);
  }).catch(()=>{});
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkForUpdate()});
// ---------- boot ----------
function boot(){
  resize(); ensureMissions(); renderHome(); show("home");
  const info=checkStreak(); if(info) streakModal(info);
  requestAnimationFrame(t=>{last=t;frame(t)});
  checkForUpdate();
}
window.claude?.hot?.snapshot?.(()=>({}));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
